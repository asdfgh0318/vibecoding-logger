<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="120" fill="url(#bg)"/>
  <rect y="90" width="1200" height="30" fill="url(#accent)"/>

  <!-- Decorative dots -->
  <circle cx="693" cy="107" r="1" fill="#00ff88" opacity="0.03"/>
<circle cx="386" cy="104" r="2" fill="#00ff88" opacity="0.04"/>
<circle cx="879" cy="101" r="3" fill="#00ff88" opacity="0.05"/>
<circle cx="572" cy="98" r="1" fill="#00ff88" opacity="0.06"/>
<circle cx="265" cy="95" r="2" fill="#00ff88" opacity="0.07"/>
<circle cx="758" cy="92" r="3" fill="#00ff88" opacity="0.03"/>
<circle cx="451" cy="89" r="1" fill="#00ff88" opacity="0.04"/>
<circle cx="944" cy="86" r="2" fill="#00ff88" opacity="0.05"/>
<circle cx="637" cy="83" r="3" fill="#00ff88" opacity="0.06"/>
<circle cx="330" cy="80" r="1" fill="#00ff88" opacity="0.07"/>
<circle cx="823" cy="77" r="2" fill="#00ff88" opacity="0.03"/>
<circle cx="516" cy="74" r="3" fill="#00ff88" opacity="0.04"/>


  <!-- Accent line -->
  <line x1="0" y1="118" x2="1200" y2="118" stroke="url(#line)" stroke-width="2"/>

  <!-- Icon -->
  <g color="#00ff88">
    <g transform="translate(80,35) scale(0.9)" opacity="0.12">
      <rect x="0" y="0" width="50" height="60" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="10" y1="15" x2="40" y2="15" stroke="currentColor" stroke-width="2"/>
      <line x1="10" y1="25" x2="35" y2="25" stroke="currentColor" stroke-width="2"/>
      <line x1="10" y1="35" x2="40" y2="35" stroke="currentColor" stroke-width="2"/>
      <line x1="10" y1="45" x2="30" y2="45" stroke="currentColor" stroke-width="2"/>
      <circle cx="5" cy="15" r="2" fill="currentColor"/>
      <circle cx="5" cy="25" r="2" fill="currentColor"/>
      <circle cx="5" cy="35" r="2" fill="currentColor"/>
      <circle cx="5" cy="45" r="2" fill="currentColor"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="52" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#e6edf3" text-anchor="middle" letter-spacing="1">Vibecoding Logger</text>

  <!-- Subtitle -->
  <text x="600" y="78" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">Automated work session logging across projects</text>
</svg>